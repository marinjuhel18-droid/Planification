<title>Suivi Natation — Équipe</title>
<style>
  :root {
    --bg: #F4FAFA;
    --surface: #FFFFFF;
    --surface-2: #E9F3F3;
    --ink: #0B2530;
    --ink-dim: #52707A;
    --line: #D3E4E4;
    --teal: #12707E;
    --teal-deep: #0A4A55;
    --amber: #F2B134;
    --coral: #E2725B;
    --radius: 10px;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0A1F26; --surface: #0F2A32; --surface-2: #123640;
      --ink: #EAF4F4; --ink-dim: #9BC1C6; --line: #1D4550;
      --teal: #3FB6C4; --teal-deep: #1D808F; --amber: #F2B134; --coral: #EF8A76;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0A1F26; --surface: #0F2A32; --surface-2: #123640;
    --ink: #EAF4F4; --ink-dim: #9BC1C6; --line: #1D4550;
    --teal: #3FB6C4; --teal-deep: #1D808F; --amber: #F2B134; --coral: #EF8A76;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: Inter, -apple-system, "Segoe UI", sans-serif;
    height: 100%; min-height: 100vh;
  }
  h1, h2, h3, .num {
    font-family: "Space Grotesk", Inter, sans-serif;
  }
  .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }

  .app { display: flex; min-height: 100vh; }

  /* Sidebar */
  .sidebar {
    width: 230px; flex-shrink: 0; background: var(--surface);
    border-right: 1px solid var(--line);
    padding: 20px 14px; display: flex; flex-direction: column; gap: 14px;
  }
  .brand { display: flex; align-items: center; gap: 8px; padding: 0 4px 6px; }
  .brand svg { width: 22px; height: 22px; flex-shrink: 0; }
  .brand h1 { font-size: 16px; margin: 0; letter-spacing: -0.01em; }
  .swimmer-list { display: flex; flex-direction: column; gap: 3px; overflow-y: auto; }
  .swimmer-item {
    display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: var(--radius);
    cursor: pointer; border: 1px solid transparent; background: transparent; text-align: left;
    color: var(--ink); font-size: 14px; font-family: inherit; width: 100%;

  .swimmer-item:hover { background: var(--surface-2); }
  .swimmer-item.active { background: var(--surface-2); border-color: var(--line); font-weight: 600; }

  .swimmer-item .actions { margin-left: auto; display: flex; gap: 2px; flex-shrink: 0; }
  .swimmer-item .actions button {
    font-size: 12px; color: var(--ink-dim); background: none; border: none; cursor: pointer; padding: 3px 5px; border-radius: 5px;
  }

  .swimmer-item .actions .del:hover { color: var(--coral); }

  .add-swimmer { display: flex; gap: 6px; margin-top: 4px; }
  .add-swimmer input {
    flex: 1; min-width: 0; padding: 7px 8px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--bg); color: var(--ink); font-size: 13px;
  }
  .icon-btn {
    border: 1px solid var(--line); background: var(--surface-2); color: var(--ink);

  .section-label { font-size: 10px; color: var(--ink-dim); font-weight: 700; text-transform: uppercase; letter-spacing: .04em; margin: 2px 0 2px; }
  .sidebar-divider { border: none; border-top: 1px solid var(--line); margin: 10px 0; }

  /* Main */
  .main { flex: 1; min-width: 0; padding: 22px 26px 60px; overflow-x: hidden; }
  .topbar {

  .period-tabs { display: flex; gap: 4px; background: var(--surface-2); padding: 3px; border-radius: 9px; }

  }
  .period-tabs button.active { background: var(--surface); color: var(--teal-deep); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .nav-period { display: flex; align-items: center; gap: 10px; }

  .nav-period button:hover { border-color: var(--teal); }
  .period-label { font-size: 14px; font-weight: 600; min-width: 150px; text-align: center; }
  .today-btn { font-size: 12px; color: var(--teal-deep); background: none; border: none; cursor: pointer; text-decoration: underline; }

  .stat-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 22px; }
  .stat-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
  .stat-card .label { font-size: 12px; color: var(--ink-dim); margin-bottom: 6px; }
  .stat-card .num { font-size: 24px; font-weight: 600; }
  .stat-card .sub { font-size: 11px; color: var(--ink-dim); margin-top: 2px; }

  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; margin-bottom: 20px; }
  .panel h2 { font-size: 14px; margin: 0 0 14px; color: var(--ink-dim); font-weight: 600; text-transform: none; }

  .chart-wrap { overflow-x: auto; }
  .chart-wrap svg { display: block; min-width: 100%; }
  .bar { fill: var(--teal); }
  .bar-track { fill: var(--surface-2); }
  .chart-label { font-size: 10px; fill: var(--ink-dim); font-family: Inter, sans-serif; }
  .chart-value { font-size: 10px; fill: var(--ink); font-family: "IBM Plex Mono", monospace; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; font-size: 11px; color: var(--ink-dim); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  td { padding: 8px; border-bottom: 1px solid var(--line); }
  tr:last-child td { border-bottom: none; }
  .zone-chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; }
  .zone-dot { width: 8px; height: 8px; border-radius: 50%; }
  .row-actions button {
    border: none; background: none; cursor: pointer; color: var(--ink-dim); font-size: 12px; padding: 3px 5px;
  }
  .row-actions button:hover { color: var(--teal); }
  .empty { color: var(--ink-dim); font-size: 13px; padding: 20px 0; text-align: center; }

  .primary-btn {
    background: var(--teal); color: #fff; border: none; border-radius: 8px; padding: 9px 16px;
    font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit;
  }
  .primary-btn:hover { background: var(--teal-deep); }

  /* Modal */
  .overlay {
    position: fixed; inset: 0; background: rgba(10,30,38,.45); display: none; align-items: flex-start; justify-content: center;
    z-index: 50; padding: 40px 20px; overflow-y: auto;
  }
  .overlay.open { display: flex; }
  .modal { background: var(--surface); border-radius: 14px; padding: 22px; width: 100%; max-width: 380px; border: 1px solid var(--line); margin: 0 auto; }
  .modal h3 { margin: 0 0 16px; font-size: 16px; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12px; color: var(--ink-dim); margin-bottom: 5px; }
  .field input, .field select {
    width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--bg); color: var(--ink); font-size: 14px; font-family: inherit;
  }
  .modal-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; }
  .link-btn { background: none; border: none; color: var(--coral); cursor: pointer; font-size: 13px; padding: 4px; }
  .btn-group { display: flex; gap: 8px; }
  .ghost-btn { background: none; border: 1px solid var(--line); color: var(--ink); border-radius: 8px; padding: 8px 14px; cursor: pointer; font-size: 13px; }

  @media (max-width: 760px) {
    .app { flex-direction: column; }
    .sidebar { width: 100%; border-right: none; border-bottom: 1px solid var(--line); flex-direction: row; align-items: center; flex-wrap: wrap; padding: 12px 14px; }
    .swimmer-list { flex-direction: row; overflow-x: auto; }
    .main { padding: 16px; }
    .stat-row { grid-template-columns: repeat(2, 1fr); }
  }

  .stroke-bars { display: flex; flex-direction: column; gap: 10px; }
  .stroke-bar-row { display: grid; grid-template-columns: 90px 1fr 60px; align-items: center; gap: 10px; font-size: 12px; }
  .stroke-bar-track { background: var(--surface-2); border-radius: 6px; height: 12px; overflow: hidden; }
  .stroke-bar-fill { height: 100%; border-radius: 6px; }

  .series-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 8px; }
  .series-row { display: grid; grid-template-columns: 56px 1fr 1fr 24px; gap: 6px; align-items: center; }
  .series-row input, .series-row select { padding: 6px 7px; font-size: 13px; border-radius: 7px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font-family: inherit; }
  .series-row .rm-series { background: none; border: none; color: var(--ink-dim); cursor: pointer; font-size: 14px; }
  .series-row .rm-series:hover { color: var(--coral); }
  .add-series-btn { background: none; border: 1px dashed var(--line); color: var(--teal-deep); border-radius: 7px; padding: 6px 10px; font-size: 12px; cursor: pointer; width: 100%; margin-bottom: 10px; }
  .add-series-btn:hover { border-color: var(--teal); }
  .total-dist { font-size: 13px; color: var(--ink-dim); margin: 4px 0 14px; }
  .total-dist span { color: var(--ink); font-weight: 600; }

  .presence-row { display: flex; align-items: center; justify-content: space-between; padding: 7px 2px; border-bottom: 1px solid var(--line); font-size: 13px; gap: 10px; }
  .presence-row:last-child { border-bottom: none; }
  .presence-toggle { display: flex; gap: 4px; flex-shrink: 0; }
  .presence-toggle button {
    border: 1px solid var(--line); background: var(--surface-2); color: var(--ink-dim);
    border-radius: 6px; padding: 4px 10px; font-size: 12px; cursor: pointer; font-family: inherit;
  }
  .presence-toggle button.active-present { background: #C8E6C9; color: #1B5E20; border-color: #8BC34A; }
  .presence-toggle button.active-absent { background: #F4CCC7; color: #8B2E22; border-color: #E2725B; }
  .rate-chip { display: inline-block; padding: 2px 9px; border-radius: 20px; font-size: 12px; font-weight: 600; }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 8px;
    font-size: 13px; z-index: 100; box-shadow: 0 6px 20px rgba(0,0,0,.25);

  }
  .toast.show { opacity: 1; }
  .toast.error { background: var(--coral); color: #fff; }

  .swimmer-item .rename-input {

  .result-row { display: grid; grid-template-columns: 1fr 1fr 84px 24px; gap: 6px; align-items: center; margin-bottom: 8px; }

</head>

<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none"><path d="M2 17c1.5 1.3 3 1.3 4.5 0s3-1.3 4.5 0 3 1.3 4.5 0 3-1.3 4.5 0" stroke="var(--teal)" stroke-width="1.8" stroke-linecap="round"/><circle cx="17" cy="6" r="2" fill="var(--amber)"/><path d="M4 12l9-2.5-2-2.3-4 1" stroke="var(--teal-deep)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <h1>Suivi Natation</h1>
    </div>
    <div class="section-label">Équipe</div>
    <div class="swimmer-list" id="teamList"></div>
    <form class="add-swimmer" id="addTeamForm">
      <input type="text" id="newTeamName" placeholder="Nom de l'équipe" required>
      <button class="icon-btn" type="submit">+</button>
    </form>
    <hr class="sidebar-divider">
    <div class="section-label">Nageurs</div>
    <div class="swimmer-list" id="swimmerList"></div>
    <form class="add-swimmer" id="addSwimmerForm">
      <input type="text" id="newSwimmerName" placeholder="Nom du nageur" required>
      <button class="icon-btn" type="submit">+</button>
    </form>
    <div id="storageNote" style="font-size:11px;color:var(--ink-dim);margin-top:4px;"></div>
    <button class="icon-btn" id="exportBtn" style="margin-top:6px;">⬇ Exporter (.xlsx)</button>
  </aside>

  <main class="main">
    <div class="period-tabs" id="modeTabs" style="margin-bottom:14px;">
      <button data-mode="training">Entraînements</button>
      <button data-mode="attendance">Présence</button>
      <button data-mode="competition">Compétitions</button>
    </div>
    <div class="topbar">
      <div class="period-tabs" id="periodTabs">
        <button data-period="week">Semaine</button>
        <button data-period="month">Mois</button>
        <button data-period="quarter">Trimestre</button>
        <button data-period="year">Année</button>
      </div>
      <select id="eventSelect" style="display:none;border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--surface);color:var(--ink);font-size:13px;font-family:inherit;"></select>
      <select id="courseSelect" style="display:none;border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--surface);color:var(--ink);font-size:13px;font-family:inherit;">
        <option value="25">Bassin 25 m</option>
        <option value="50">Bassin 50 m</option>
      </select>
      <div class="nav-period">
        <button id="prevPeriod" aria-label="Précédent">‹</button>
        <div>
          <div class="period-label" id="periodLabel"></div>
          <div style="text-align:center;"><button class="today-btn" id="todayBtn">aujourd'hui</button></div>
        </div>
        <button id="nextPeriod" aria-label="Suivant">›</button>
      </div>
    </div>

    <div class="stat-row" id="statRow"></div>

    <div class="panel">
      <h2 id="chartTitle">Évolution de la distance</h2>
      <div class="chart-wrap"><svg id="chart" viewBox="0 0 700 180" preserveAspectRatio="xMinYMin meet"></svg></div>
    </div>

    <div class="panel">
      <h2 id="breakdownTitle">Répartition par nage</h2>
      <div class="stroke-bars" id="strokeBars"></div>
    </div>

    <div class="panel">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
        <h2 id="journalTitle" style="margin:0;">Journal des séances</h2>
        <button class="primary-btn" id="openAddSession">+ Nouvelle séance</button>
        <button class="primary-btn" id="openAddTraining" style="display:none;">+ Nouvel entraînement</button>
        <button class="primary-btn" id="openAddCompetition" style="display:none;">+ Nouvelle compétition</button>

</div>

<div class="overlay" id="sessionOverlay">

</div>

<div class="overlay" id="attendanceOverlay">

        <input type="text" id="aLabel" placeholder="ex : séance du soir">

      <div class="field">
        <label>Présence</label>
        <div id="presenceList" style="max-height:280px;overflow-y:auto;"></div>
      </div>
      <div class="modal-actions">
        <button type="button" class="link-btn" id="deleteTrainingBtn" style="display:none;">Supprimer</button>
        <div class="btn-group" style="margin-left:auto;">
          <button type="button" class="ghost-btn" id="cancelAttendance">Annuler</button>
          <button type="submit" class="primary-btn">Enregistrer</button>
        </div>
      </div>
    </form>
  </div>
</div>

<div class="overlay" id="competitionOverlay">
  <div class="modal">
    <h3 id="competitionModalTitle">Nouvelle compétition</h3>
    <form id="competitionForm">
      <input type="hidden" id="competitionId">
      <div class="field">
        <label>Date</label>
        <input type="date" id="cDate" required>
      </div>
      <div class="field">
        <label>Nom de la compétition</label>
        <input type="text" id="cName" placeholder="ex : Meeting de Concarneau" required>
      </div>
      <div class="field">
        <label>Bassin</label>
        <select id="cCourse">
          <option value="25">25 mètres (petit bassin)</option>
          <option value="50">50 mètres (grand bassin)</option>
        </select>
      </div>
      <div class="field">
        <label>Résultats</label>
        <div id="resultsList" style="max-height:260px;overflow-y:auto;"></div>
        <button type="button" class="add-result-btn" id="addResultBtn">+ Ajouter un résultat</button>
      </div>
      <div class="modal-actions">
        <button type="button" class="link-btn" id="deleteCompetitionBtn" style="display:none;">Supprimer</button>
        <div class="btn-group" style="margin-left:auto;">
          <button type="button" class="ghost-btn" id="cancelCompetition">Annuler</button>
          <button type="submit" class="primary-btn">Enregistrer</button>
        </div>
      </div>
    </form>
  </div>
</div>

<div class="overlay" id="importOverlay">
  <div class="modal" style="max-width:480px;">
    <h3>Importer depuis Extranat</h3>
    <div class="field">
      <label>Nageur concerné</label>
      <select id="iSwimmer"></select>
    </div>
    <div class="field">
      <label>Texte copié depuis la page Extranat du nageur</label>
      <textarea id="iText" rows="8" style="width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:12px;font-family:inherit;resize:vertical;" placeholder="Collez ici le texte de la page « Rechercher des Perf. »"></textarea>
    </div>
    <div id="importPreview" style="font-size:13px;color:var(--ink-dim);margin-bottom:10px;"></div>
    <div class="modal-actions">
      <div class="btn-group" style="margin-left:auto;">
        <button type="button" class="ghost-btn" id="cancelImport">Annuler</button>
        <button type="button" class="ghost-btn" id="analyzeImportBtn">Analyser</button>
        <button type="button" class="primary-btn" id="confirmImportBtn" style="display:none;">Importer</button>
      </div>
    </div>
  </div>
</div>

  ];
  function eventOf(k){ return EVENTS.find(e=>e.key===k) || EVENTS[0]; }
  function parseTime(str){
    if(!str) return null;
    const s = str.trim().replace(",", ".");
    const m = s.match(/^(?:(\d+):)?(\d{1,2}(?:\.\d{1,2})?)$/);
    if(!m) return null;
    const mins = m[1] ? parseInt(m[1],10) : 0;
    const secs = parseFloat(m[2]);
    return Math.round((mins*60+secs)*100);
  }
  function formatTime(cs){
    if(cs==null || isNaN(cs)) return "—";
    const totalCs = Math.round(cs);
    const mins = Math.floor(totalCs/6000);
    const rem = totalCs % 6000;
    const secs = Math.floor(rem/100);
    const cc = rem % 100;
    const secStr = pad(secs)+"."+pad(cc);
    return mins>0 ? mins+":"+secStr : secStr;
  }
  const MONTHS_SHORT = ["janv","févr","mars","avr","mai","juin","juil","août","sept","oct","nov","déc"];
  const MONTHS_LONG = ["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"];

  let state = { teams: [], selectedTeam: null, swimmers: [], sessions: [], trainings: [], attendance: [], competitions: [], results: [], selectedEvent: EVENTS[0].key, selectedCourse: "25", mode: "training", selected: "all", period: "week", anchor: new Date() };

  function uid(prefix){ return prefix + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function pad(n){ return n<10 ? "0"+n : ""+n; }
  function toISO(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
  function parseISO(s){ const [y,m,d]=s.split("-").map(Number); return new Date(y, m-1, d); }
  function mondayIndex(d){ return (d.getDay()+6)%7; }
  function startOfWeek(d){ const r=new Date(d); r.setHours(0,0,0,0); r.setDate(r.getDate()-mondayIndex(r)); return r; }
  function addDays(d,n){ const r=new Date(d); r.setDate(r.getDate()+n); return r; }
  function zoneOf(k){ return ZONES.find(z=>z.key===Number(k)) || ZONES[1]; }
  function strokeOf(k){ return STROKES.find(z=>z.key===k) || STROKES[0]; }
  function sessionSeries(s){ return Array.isArray(s.series) && s.series.length ? s.series : null; }
  function sessionDistance(s){
    const series = sessionSeries(s);
    if(series) return series.reduce((a,r)=>a + Number(r.reps||0)*Number(r.distanceM||0), 0);
    return Number(s.distanceM||0);
  }
  function sessionStrokeNames(s){
    const series = sessionSeries(s);
    if(!series) return "—";
    const names = [...new Set(series.map(r=>strokeOf(r.stroke).name))];
    return names.join(", ");
  }
  function swimmerOf(id){ return state.swimmers.find(s=>s.id===id); }
  function colorFor(swimmer){
    const teamMembers = state.swimmers.filter(s=>s.teamId===swimmer.teamId);
    const idx = teamMembers.findIndex(s=>s.id===swimmer.id);

  }

  // ---- persistence layer (Supabase) ----
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  function rowToCompetition(r){ return { id:r.id, teamId:r.team_id, date:r.date, name:r.name, course:r.course }; }

  async function fetchAll(){
    const [t, sw, se, tr, at, cp, rs] = await Promise.all([
      supabase.from("teams").select("*").order("created_at"),
      supabase.from("swimmers").select("*").order("created_at"),
      supabase.from("sessions").select("*"),
      supabase.from("trainings").select("*"),
      supabase.from("attendance").select("*"),
      supabase.from("competitions").select("*"),
      supabase.from("results").select("*")
    ]);
    for(const r of [t,sw,se,tr,at,cp,rs]) if(r.error) throw r.error;
    state.teams = (t.data||[]).map(rowToTeam);
    state.swimmers = (sw.data||[]).map(rowToSwimmer);
    state.sessions = (se.data||[]).map(rowToSession);
    state.trainings = (tr.data||[]).map(rowToTraining);
    state.attendance = (at.data||[]).map(rowToAttendance);
    state.competitions = (cp.data||[]).map(rowToCompetition);
    state.results = (rs.data||[]).map(rowToResult);

  // ---- period logic ----
  function periodRange(type, anchor){
    if(type==="week"){
      const start = startOfWeek(anchor);
      return { start, end: addDays(start,7) };
    }
    if(type==="month"){
      const start = new Date(anchor.getFullYear(), anchor.getMonth(), 1);
      const end = new Date(anchor.getFullYear(), anchor.getMonth()+1, 1);
      return { start, end };
    }
    if(type==="quarter"){
      const qStartMonth = Math.floor(anchor.getMonth()/3)*3;
      const start = new Date(anchor.getFullYear(), qStartMonth, 1);
      const end = new Date(anchor.getFullYear(), qStartMonth+3, 1);
      return { start, end };
    }
    const start = new Date(anchor.getFullYear(), 0, 1);
    const end = new Date(anchor.getFullYear()+1, 0, 1);
    return { start, end };
  }
  function shiftAnchor(type, anchor, dir){
    const r = new Date(anchor);
    if(type==="week") r.setDate(r.getDate() + dir*7);
    else if(type==="month") r.setMonth(r.getMonth()+dir);
    else if(type==="quarter") r.setMonth(r.getMonth()+dir*3);
    else r.setFullYear(r.getFullYear()+dir);
    return r;
  }
  function periodLabel(type, start, end){
    if(type==="week"){
      const endIncl = addDays(end,-1);
      const sameMonth = start.getMonth()===endIncl.getMonth();
      return start.getDate() + (sameMonth?"":" "+MONTHS_SHORT[start.getMonth()]) + " – " + endIncl.getDate() + " " + MONTHS_SHORT[endIncl.getMonth()] + " " + endIncl.getFullYear();
    }
    if(type==="month") return MONTHS_LONG[start.getMonth()] + " " + start.getFullYear();
    if(type==="quarter") return "T" + (Math.floor(start.getMonth()/3)+1) + " " + start.getFullYear();
    return "" + start.getFullYear();
  }
  function bucketIndex(type, d, start){
    if(type==="week"){ return mondayIndex(d); }
    if(type==="month"){
      const offset = mondayIndex(start);
      return Math.floor((d.getDate()-1+offset)/7);
    }
    return (d.getFullYear()-start.getFullYear())*12 + (d.getMonth()-start.getMonth());
  }
  function bucketLabels(type, start, end){
    if(type==="week") return WEEKDAYS.slice();
    if(type==="month"){
      const lastDay = addDays(end,-1);
      const n = bucketIndex("month", lastDay, start) + 1;
      const labels = [];
      for(let i=0;i<n;i++) labels.push("S"+(i+1));
      return labels;
    }
    const n = type==="quarter" ? 3 : 12;
    const labels = [];
    for(let i=0;i<n;i++){
      const m = (start.getMonth()+i)%12;
      labels.push(MONTHS_SHORT[m]);
    }
    return labels;
  }

  function filteredSessions(){
    const { start, end } = periodRange(state.period, state.anchor);
    const teamIds = new Set(teamSwimmers().map(s=>s.id));
    return state.sessions.filter(s=>{
      if(!teamIds.has(s.swimmerId)) return false;
      const d = parseISO(s.date);
      if(d < start || d >= end) return false;
      if(state.selected!=="all" && s.swimmerId!==state.selected) return false;
      return true;
    }).sort((a,b)=> a.date < b.date ? 1 : -1);
  }

  // ---- attendance helpers ----
  function filteredTrainings(){
    const { start, end } = periodRange(state.period, state.anchor);
    return state.trainings.filter(t=>{
      if(t.teamId!==state.selectedTeam) return false;
      const d = parseISO(t.date);
      return d>=start && d<end;
    }).sort((a,b)=> a.date < b.date ? 1 : -1);
  }

  // ---- competition helpers ----
  function filteredCompetitions(){
    const { start, end } = periodRange(state.period, state.anchor);
    return state.competitions.filter(c=>{
      if(c.teamId!==state.selectedTeam) return false;
      const d = parseISO(c.date);
      return d>=start && d<end;
    }).sort((a,b)=> a.date < b.date ? 1 : -1);
  }
  function resultsFor(competitions, swimmerId, eventKey){
    const compIds = new Set(competitions.map(c=>c.id));
    return state.results.filter(r=>{
      if(!compIds.has(r.competitionId)) return false;
      if(eventKey && r.event!==eventKey) return false;
      if(swimmerId && r.swimmerId!==swimmerId) return false;
      return true;
    });
  }
  function swimmerEventTimeline(competitions, swimmerId, eventKey){
    return competitions
      .map(c=>{
        const r = state.results.find(x=>x.competitionId===c.id && x.swimmerId===swimmerId && x.event===eventKey);
        return r ? { competition:c, timeCs:r.timeCs } : null;
      })
      .filter(Boolean)
      .sort((a,b)=> a.competition.date < b.competition.date ? -1 : 1);
  }
  function personalBest(competitions, swimmerId, eventKey){
    const timeline = swimmerEventTimeline(competitions, swimmerId, eventKey);
    if(!timeline.length) return null;
    return timeline.reduce((best,e)=> e.timeCs<best ? e.timeCs : best, timeline[0].timeCs);
  }
  function teamEventRanking(competitions, eventKey){
    return teamSwimmers().map(sw=>{
      const best = personalBest(competitions, sw.id, eventKey);
      return { swimmer: sw, best };
    }).filter(e=>e.best!=null).sort((a,b)=>a.best-b.best);
  }

  // ---- Extranat import ----
  function parseExtranatText(text){
    const strokeMap = { "nage libre":"crawl", "dos":"dos", "brasse":"brasse", "papillon":"papillon", "4 nages":"4nages" };
    const headerRegex = /(\d{2,4})\s*(?:m\.?|m\b)?\s+(Nage\s*Libre|4\s*Nages|Dos|Brasse|Papillon)\b/gi;
    const headers = [];
    let hm;
    while((hm = headerRegex.exec(text))){
      const strokeRaw = hm[2].toLowerCase().replace(/\s+/g," ").trim();
      const strokeKey = strokeMap[strokeRaw];
      const eventKey = hm[1]+"_"+strokeKey;
      if(strokeKey && EVENTS.some(e=>e.key===eventKey)){
        headers.push({ index: hm.index, eventKey });
      }
    }
    if(!headers.length) return [];

    const timeMatches = [...text.matchAll(/\b\d{1,2}:\d{2}\.\d{2}\b/g)].map(m=>({ index:m.index, value:m[0] }));
    const dateMatches = [...text.matchAll(/\b(\d{2})\/(\d{2})\/(\d{4})\b/g)].map(m=>({ index:m.index, dd:m[1], mm:m[2], yyyy:m[3] }));

    const results = [];
    headers.forEach((h,i)=>{
      const rangeEnd = i+1<headers.length ? headers[i+1].index : text.length;
      const blockText = text.slice(h.index, rangeEnd);
      const courseMatch = blockText.match(/Bassin\s*:\s*(25|50)/i);
      const course = courseMatch ? courseMatch[1] : "25";
      const blockTimes = timeMatches.filter(t=>t.index>=h.index && t.index<rangeEnd);
      const blockDates = dateMatches.filter(d=>d.index>=h.index && d.index<rangeEnd);
      const n = Math.min(blockTimes.length, blockDates.length);
      for(let k=0;k<n;k++){
        const cs = parseTime(blockTimes[k].value);
        const d = blockDates[k];
        const iso = d.yyyy+"-"+d.mm+"-"+d.dd;
        if(cs!=null) results.push({ eventKey: h.eventKey, date: iso, timeCs: cs, course });
      }
    });
    return results;
  }
  function groupResultsByDate(results){
    const byKey = {};
    results.forEach(r=>{
      const key = r.date+"|"+r.course;
      if(!byKey[key]) byKey[key] = { date:r.date, course:r.course, results:[] };
      byKey[key].results.push(r);
    });
    return Object.values(byKey).sort((a,b)=>a.date<b.date?-1:1);
  }
  function attendanceForTraining(trainingId){
    return state.attendance.filter(a=>a.trainingId===trainingId);
  }
  function trainingStats(t){
    const recs = attendanceForTraining(t.id);
    const present = recs.filter(r=>r.present).length;
    const total = recs.length;
    return { present, total, rate: total ? present/total : null };
  }
  function rateColor(rate){
    if(rate==null) return { bg:"var(--surface-2)", fg:"var(--ink-dim)", bar:"var(--line)" };
    if(rate>=0.8) return { bg:"#C8E6C9", fg:"#1B5E20", bar:"#2E9E7B" };
    if(rate>=0.5) return { bg:"#FCEBC0", fg:"#8A6D1B", bar:"#F2B134" };
    return { bg:"#F4CCC7", fg:"#8B2E22", bar:"#E2725B" };
  }
  function periodAttendanceRate(trainings, swimmerId){
    let present=0, total=0;
    trainings.forEach(t=>{
      const recs = attendanceForTraining(t.id);
      const filtered = swimmerId ? recs.filter(r=>r.swimmerId===swimmerId) : recs;
      present += filtered.filter(r=>r.present).length;
      total += filtered.length;
    });
    return total ? present/total : null;
  }
  function swimmerAttendanceRates(trainings){
    return teamSwimmers().map(sw=>{
      let present=0, total=0;
      trainings.forEach(t=>{
        const rec = state.attendance.find(a=>a.trainingId===t.id && a.swimmerId===sw.id);
        if(rec){ total++; if(rec.present) present++; }
      });
      return { swimmer: sw, present, total, rate: total ? present/total : null };
    }).filter(e=>e.total>0);
  }

  function strokeDistanceMap(sessions){
    const map = {};
    sessions.forEach(s=>{
      const series = sessionSeries(s);
      if(series){
        series.forEach(r=>{
          const d = Number(r.reps||0)*Number(r.distanceM||0);
          map[r.stroke] = (map[r.stroke]||0) + d;
        });
      }
    });
    return map;
  }

  function renderStats(sessions){
    const totalDist = sessions.reduce((a,s)=>a+sessionDistance(s),0);
    const totalDur = sessions.reduce((a,s)=>a+Number(s.durationMin||0),0);
    const count = sessions.length;
    const avgInt = count ? (sessions.reduce((a,s)=>a+Number(s.intensity||0),0)/count) : 0;
    const hrs = Math.floor(totalDur/60), mins = Math.round(totalDur%60);
    const strokeMap = strokeDistanceMap(sessions);
    let dominant = "—";
    const strokeEntries = Object.entries(strokeMap);
    if(strokeEntries.length){
      strokeEntries.sort((a,b)=>b[1]-a[1]);
      dominant = strokeOf(strokeEntries[0][0]).name;
    }
    const cards = [
      { label:"Distance totale", value:(totalDist/1000).toLocaleString("fr-FR",{maximumFractionDigits:1}), sub:"km" },
      { label:"Temps d'entraînement", value: hrs+"h"+pad(mins), sub: count+" séance"+(count>1?"s":"") },
      { label:"Séances", value: count, sub: state.selected==="all" ? "équipe" : "individuel" },
      { label:"Intensité moyenne", value: avgInt? avgInt.toFixed(1):"—", sub: avgInt? zoneOf(Math.round(avgInt)).name : "" },
      { label:"Nage dominante", value: dominant, sub: "sur la période" }
    ];
    const row = document.getElementById("statRow");
    row.innerHTML = "";
    cards.forEach(c=>{
      const el = document.createElement("div");
      el.className = "stat-card";
      el.innerHTML = '<div class="label">'+c.label+'</div><div class="num mono">'+c.value+'</div><div class="sub">'+c.sub+'</div>';
      row.appendChild(el);
    });
  }

  function renderChart(sessions){
    const { start, end } = periodRange(state.period, state.anchor);
    const labels = bucketLabels(state.period, start, end);
    const values = new Array(labels.length).fill(0);
    sessions.forEach(s=>{
      const idx = bucketIndex(state.period, parseISO(s.date), start);
      if(idx>=0 && idx<values.length) values[idx] += sessionDistance(s)/1000;
    });
    const svg = document.getElementById("chart");
    const W = Math.max(700, labels.length*70), H = 180;
    svg.setAttribute("viewBox", "0 0 "+W+" "+H);
    const max = Math.max(1, ...values);
    const barW = (W-40)/labels.length*0.55;
    const gap = (W-40)/labels.length;
    let svgHtml = "";
    labels.forEach((lab,i)=>{
      const x = 30 + i*gap + (gap - barW)/2;
      const h = Math.max(2, (values[i]/max)*118);
      const y = 140 - h;
      svgHtml += '<rect class="bar-track" x="'+x+'" y="10" width="'+barW+'" height="130" rx="4"></rect>';
      svgHtml += '<rect class="bar" x="'+x+'" y="'+y+'" width="'+barW+'" height="'+h+'" rx="4"></rect>';
      svgHtml += '<text class="chart-value" x="'+(x+barW/2)+'" y="'+(y-6<14?14:y-6)+'" text-anchor="middle">'+(values[i]?values[i].toFixed(1):"")+'</text>';
      svgHtml += '<text class="chart-label" x="'+(x+barW/2)+'" y="158" text-anchor="middle">'+lab+'</text>';
    });
    svg.innerHTML = svgHtml;
    document.getElementById("chartTitle").textContent = "Évolution de la distance (km)" + (state.selected!=="all" && swimmerOf(state.selected) ? " — "+swimmerOf(state.selected).name : "");
  }

  function renderStrokeBreakdown(sessions){

    const container = document.getElementById("strokeBars");
    const entries = STROKES.map(st => ({ st, dist: map[st.key]||0 })).filter(e=>e.dist>0);
    if(!entries.length){
      container.innerHTML = '<div class="empty">Pas de séries enregistrées sur cette période.</div>';
      return;
    }
    entries.sort((a,b)=>b.dist-a.dist);
    const max = Math.max(...entries.map(e=>e.dist));
    container.innerHTML = entries.map(e => {
      const pct = Math.max(4, Math.round((e.dist/max)*100));
      return '<div class="stroke-bar-row">'+

        '<div class="mono" style="text-align:right;">'+(e.dist/1000).toLocaleString("fr-FR",{maximumFractionDigits:1})+' km</div>'+

  function renderCompetitionChart(competitions){
    const eventKey = state.selectedEvent;
    const chronoComps = competitions.slice().sort((a,b)=> a.date<b.date?-1:1);
    const swimmersToPlot = state.selected==="all" ? teamSwimmers() : [swimmerOf(state.selected)].filter(Boolean);
    const lines = swimmersToPlot.map((sw,idx)=>({
      swimmer: sw,
      color: colorFor(sw),
      points: swimmerEventTimeline(chronoComps, sw.id, eventKey)
    })).filter(l=>l.points.length>0);

    const svg = document.getElementById("chart");
    document.getElementById("chartTitle").textContent = "Évolution des temps — " + eventOf(eventKey).name + (state.selected!=="all" && swimmerOf(state.selected) ? " — "+swimmerOf(state.selected).name : "");

    if(!lines.length){
      svg.setAttribute("viewBox", "0 0 700 180");
      svg.innerHTML = '<text x="350" y="95" text-anchor="middle" class="chart-label">Aucun résultat pour cette épreuve sur la période.</text>';
      return;
    }
    const allTimes = lines.flatMap(l=>l.points.map(p=>p.timeCs));
    const allComps = [...new Set(lines.flatMap(l=>l.points.map(p=>p.competition.id)))]
      .map(id=>chronoComps.find(c=>c.id===id)).sort((a,b)=>a.date<b.date?-1:1);
    const minT = Math.min(...allTimes), maxT = Math.max(...allTimes);
    const span = Math.max(1, maxT-minT);
    const W = Math.max(700, allComps.length*90), H = 200;
    const padL = 50, padR = 20, padT = 16, padB = 40;
    svg.setAttribute("viewBox", "0 0 "+W+" "+H);
    const xFor = compId => {
      const idx = allComps.findIndex(c=>c.id===compId);
      return padL + (allComps.length<=1 ? (W-padL-padR)/2 : idx*((W-padL-padR)/(allComps.length-1)));
    };
    const yFor = t => padT + (1 - (t-minT)/span) * (H-padT-padB);

    let svgHtml = "";
    // gridlines + labels
    allComps.forEach(c=>{
      const x = xFor(c.id);
      const d = parseISO(c.date);
      svgHtml += '<line x1="'+x+'" y1="'+padT+'" x2="'+x+'" y2="'+(H-padB)+'" stroke="var(--line)" stroke-width="1"></line>';
      svgHtml += '<text class="chart-label" x="'+x+'" y="'+(H-padB+16)+'" text-anchor="middle">'+pad(d.getDate())+"/"+pad(d.getMonth()+1)+'</text>';
    });
    lines.forEach(line=>{
      const pts = line.points.map(p=>xFor(p.competition.id)+","+yFor(p.timeCs)).join(" ");
      svgHtml += '<polyline points="'+pts+'" fill="none" stroke="'+line.color+'" stroke-width="2.5"></polyline>';
      line.points.forEach(p=>{
        svgHtml += '<circle cx="'+xFor(p.competition.id)+'" cy="'+yFor(p.timeCs)+'" r="4" fill="'+line.color+'"></circle>';
        svgHtml += '<text class="chart-value" x="'+xFor(p.competition.id)+'" y="'+(yFor(p.timeCs)-9)+'" text-anchor="middle">'+formatTime(p.timeCs)+'</text>';
      });
    });
    svg.innerHTML = svgHtml;
  }

      const swimmersInComp = swimmerIds.map(id=>swimmerOf(id)).filter(Boolean);

      const extra = swimmersInComp.length - shown.length;
      const namesHtml = shown.map(sw=>
        '<span style="display:inline-flex;align-items:center;gap:4px;margin-right:8px;">'+
        '<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:'+colorFor(sw)+';"></span>'+

      ).join("") + (extra>0 ? '<span class="mono" style="color:var(--ink-dim);">+'+extra+' autre'+(extra>1?"s":"")+'</span>' : "");

      const tr = document.createElement("tr");
      tr.innerHTML =
        '<td class="mono">'+pad(d.getDate())+"/"+pad(d.getMonth()+1)+"/"+d.getFullYear()+'</td>'+

        '<td>'+(namesHtml||"—")+'</td>'+
        '<td class="mono">'+recs.length+'</td>'+
        '<td class="row-actions"><button data-edit-competition="'+c.id+'">Modifier</button></td>';
      body.appendChild(tr);

    const teamsData = state.teams.map(t=>({ "Équipe": t.name }));
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(teamsData.length?teamsData:[{"Équipe":""}]), "Équipes");

    const nageursData = state.swimmers.map(s=>({ "Équipe": teamName(s.teamId), "Nom": s.name }));
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(nageursData.length?nageursData:[{"Équipe":"","Nom":""}]), "Nageurs");

    const seancesData = state.sessions.map(s=>{
      const sw = swimmerOf(s.swimmerId);
      return {
        "Équipe": sw ? teamName(sw.teamId) : "—",
        "Date": s.date,
        "Nageur": sw?sw.name:"—",
        "Durée (min)": s.durationMin,
        "Intensité": zoneOf(s.intensity).name,
        "Nage(s)": sessionStrokeNames(s),
        "Distance (m)": sessionDistance(s)
      };
    }).sort((a,b)=> a.Date<b.Date?-1:1);
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(seancesData.length?seancesData:[{}]), "Séances");

    const trainingsData = state.trainings.map(t=>{
      const st = trainingStats(t);
      return {
        "Équipe": teamName(t.teamId),
        "Date": t.date,
        "Libellé": t.label||"",
        "Présents": st.present,
        "Total": st.total,
        "Taux (%)": st.rate!=null ? Math.round(st.rate*100) : ""
      };
    }).sort((a,b)=> a.Date<b.Date?-1:1);
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(trainingsData.length?trainingsData:[{}]), "Entraînements");

    const presenceData = state.attendance.map(a=>{
      const t = state.trainings.find(x=>x.id===a.trainingId);
      const sw = swimmerOf(a.swimmerId);
      return {
        "Équipe": t ? teamName(t.teamId) : "—",
        "Date entraînement": t?t.date:"—",
        "Nageur": sw?sw.name:"—",
        "Présent": a.present ? "Oui" : "Non"
      };
    }).sort((a,b)=> (a["Date entraînement"]<b["Date entraînement"])?-1:1);
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(presenceData.length?presenceData:[{}]), "Présences");

    const resultsData = state.results.map(r=>{
      const c = state.competitions.find(x=>x.id===r.competitionId);
      const sw = swimmerOf(r.swimmerId);
      return {
        "Équipe": c ? teamName(c.teamId) : "—",
        "Date": c ? c.date : "—",
        "Compétition": c ? c.name : "—",
        "Bassin": (c ? (c.course||"25") : "25")+" m",
        "Nageur": sw ? sw.name : "—",
        "Épreuve": eventOf(r.event).name,
        "Temps": formatTime(r.timeCs)
      };
    }).sort((a,b)=> a.Date<b.Date?-1:1);
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(resultsData.length?resultsData:[{}]), "Résultats");

    return wb;
  }

  document.getElementById("exportBtn").onclick = () => {
    try{
      const wb = buildWorkbook();
      const arrBuf = XLSX.write(wb, { type:"array", bookType:"xlsx" });
      const blob = new Blob([arrBuf], { type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "suivi-natation-"+toISO(new Date())+".xlsx";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(()=>URL.revokeObjectURL(url), 2000);
      showToast("Export téléchargé.");
    }catch(err){
      showToast("Export impossible : " + (err && err.message ? err.message : err), true);
    }
  };

  initData();
})();
</script>
</body>
</html>
